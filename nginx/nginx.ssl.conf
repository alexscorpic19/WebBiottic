#=========================================================================#
# Default Web Domain Template                                             #
# DO NOT MODIFY THIS FILE! CHANGES WILL BE LOST WHEN REBUILDING DOMAINS   #
# https://hestiacp.com/docs/server-administration/web-templates.html      #
#=========================================================================#

server {
    listen      92.112.177.130:443 ssl;
    http2 on;
    server_name test.biottic.com.co;
    error_log   /var/log/apache2/domains/test.biottic.com.co.error.log error;

    ssl_certificate      /home/admin/conf/web/test.biottic.com.co/ssl/test.biottic.com.co.pem;
    ssl_certificate_key  /home/admin/conf/web/test.biottic.com.co/ssl/test.biottic.com.co.key;
    ssl_stapling        on;
    ssl_stapling_verify on;
    
    # Optimizaciones SSL
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:20m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # DNS Resolver para OSCP Stapling
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # Optimizaciones de buffer
    client_body_buffer_size 128k;
    client_max_body_size 10m;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;
    output_buffers 1 32k;
    postpone_output 1460;

    # Timeouts
    client_header_timeout 3m;
    client_body_timeout 3m;
    send_timeout 3m;
    keepalive_timeout 65; 
    keepalive_requests 100;

    # Optimizaciones de archivos
    open_file_cache max=1000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # TLS 1.3 0-RTT anti-replay
    if ($anti_replay = 307) { return 307 https://$host$request_uri; }
    if ($anti_replay = 425) { return 425; }

    include /home/admin/conf/web/test.biottic.com.co/nginx.hsts.conf*;

    root /home/admin/web/test.biottic.com.co/public_html;
    index index.html;

    # Denegar acceso a archivos ocultos
    location ~ /\.(?!well-known\/|file) {
        deny all;
        return 404;
    }

    # Configuración principal para SPA
    location / {
        root /home/admin/web/test.biottic.com.co/public_html;
        try_files $uri $uri/ /index.html;
        access_log /var/log/apache2/domains/test.biottic.com.co.log combined;
        access_log /var/log/apache2/domains/test.biottic.com.co.bytes bytes;
        
        # Cache control para archivos HTML
        expires 0;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Configuración para assets estáticos
    location /assets/ {
        root /home/admin/web/test.biottic.com.co/public_html;
        try_files $uri =404;
        access_log /var/log/apache2/domains/test.biottic.com.co.log combined;
        access_log /var/log/apache2/domains/test.biottic.com.co.bytes bytes;
        expires 30d;
        add_header Cache-Control "public, no-transform, immutable";
    }

    # Configuración específica para imágenes y archivos estáticos
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|css|js|woff2?|eot|ttf|otf|mp4|webm)$ {
        root /home/admin/web/test.biottic.com.co/public_html;
        try_files $uri =404;
        expires max;
        add_header Cache-Control "public, no-transform, immutable";
        access_log off;
        
        # Configuración de CORS para fuentes y assets
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
        add_header Access-Control-Allow-Headers "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type";
    }

    # Configuración para API
    location /api/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        
        # Configuración de CORS para la API
        add_header Access-Control-Allow-Origin "https://test.biottic.com.co" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
        add_header Access-Control-Allow-Credentials "true" always;
        
        # Manejar preflight requests
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "https://test.biottic.com.co" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }
    }

    location /error/ {
        alias /home/admin/web/test.biottic.com.co/document_errors/;
    }

    # Headers de seguridad
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval'; img-src 'self' data: https:; object-src 'none'" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/vnd.geo+json
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/opentype
        image/bmp
        image/svg+xml
        image/x-icon
        text/cache-manifest
        text/css
        text/plain
        text/vcard
        text/vnd.rim.location.xloc
        text/vtt
        text/x-component
        text/x-cross-domain-policy;

    proxy_hide_header Upgrade;

    include /home/admin/conf/web/test.biottic.com.co/nginx.ssl.conf_*;
}