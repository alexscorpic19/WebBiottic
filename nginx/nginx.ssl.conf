#=========================================================================#
# Default Web Domain Template                                             #
# DO NOT MODIFY THIS FILE! CHANGES WILL BE LOST WHEN REBUILDING DOMAINS   #
# https://hestiacp.com/docs/server-administration/web-templates.html      #
#=========================================================================#

server {
    listen      92.112.177.130:443 ssl;
    http2 on;
    server_name test.biottic.com.co;
    error_log   /var/log/apache2/domains/test.biottic.com.co.error.log error;

    ssl_certificate      /home/admin/conf/web/test.biottic.com.co/ssl/test.biottic.com.co.pem;
    ssl_certificate_key  /home/admin/conf/web/test.biottic.com.co/ssl/test.biottic.com.co.key;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # Timeouts
    client_header_timeout 3m;
    client_body_timeout 3m;
    send_timeout 3m;
    keepalive_timeout 65;
    keepalive_requests 100;

    # Optimizaciones de archivos
    open_file_cache max=1000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;
    
    # TLS 1.3 0-RTT anti-replay
    if ($anti_replay = 307) { return 307 https://$host$request_uri; }
    if ($anti_replay = 425) { return 425; }

    include /home/admin/conf/web/test.biottic.com.co/nginx.hsts.conf*;

    root /home/admin/web/test.biottic.com.co/public_html;
    index index.html;

    # Denegar acceso a archivos ocultos
    location ~ /\.(?!well-known\/|file) {
        deny all;
        return 404;
    }

    # Configuración para API - movida antes de otras ubicaciones
    location /api/ {
        proxy_pass http://localhost:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;

        # Configuración de CORS para la API
        #add_header Access-Control-Allow-Origin "https://test.biottic.com.co" always;
        #add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        #add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
        #add_header Access-Control-Allow-Credentials "true" always;

        # Manejar preflight requests
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "https://test.biottic.com.co" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }
    }

    # Configuración principal para SPA
    location / {
        try_files $uri $uri/ /index.html;
        access_log /var/log/apache2/domains/test.biottic.com.co.log combined;
        access_log /var/log/apache2/domains/test.biottic.com.co.bytes bytes;

        # Cache control para archivos HTML
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Configuración para assets estáticos
    location /assets/ {
        try_files $uri =404;
        access_log /var/log/apache2/domains/test.biottic.com.co.log combined;
        access_log /var/log/apache2/domains/test.biottic.com.co.bytes bytes;
        expires 30d;
        add_header Cache-Control "public, no-transform, immutable";
    }

    # Configuración específica para imágenes y archivos estáticos
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|css|js|woff2?|eot|ttf|otf|mp4|webm)$ {
        try_files $uri =404;
        expires max;
        add_header Cache-Control "public, no-transform, immutable";
        access_log off;

        # Configuración de CORS para fuentes y assets
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
        add_header Access-Control-Allow-Headers "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type";
    }

    location /error/ {
        alias /home/admin/web/test.biottic.com.co/document_errors/;
    }

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/vnd.geo+json
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/opentype
        image/bmp
        image/svg+xml
        image/x-icon
        text/cache-manifest
        text/css
        text/plain
        text/vcard
        text/vnd.rim.location.xloc
        text/vtt
        text/x-component
        text/x-cross-domain-policy;

    proxy_hide_header Upgrade;

    include /home/admin/conf/web/test.biottic.com.co/nginx.ssl.conf_*;
}    	
