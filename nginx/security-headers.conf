# Configuración de cabeceras de seguridad para Nginx

# Habilitar HSTS (HTTP Strict Transport Security)
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# Prevenir clickjacking
add_header X-Frame-Options "SAMEORIGIN" always;

# Habilitar X-Content-Type-Options
add_header X-Content-Type-Options "nosniff" always;

# Configurar Content Security Policy (CSP)
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'" always;

# Configurar Permissions Policy
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

# Configurar Cross-Origin Resource Sharing (CORS) - Específico para el sitio principal
add_header Access-Control-Allow-Origin "https://test.biottic.com.co" always;
add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization" always;

# Configurar Cross-Origin Opener Policy
add_header Cross-Origin-Opener-Policy "same-origin" always;

# Configurar Cross-Origin Embedder Policy
add_header Cross-Origin-Embedder-Policy "require-corp" always;

# Configurar Cross-Origin Resource Policy
add_header Cross-Origin-Resource-Policy "same-site" always;

# Configurar Referrer Policy
add_header Referrer-Policy "strict-origin-when-cross-origin" always;