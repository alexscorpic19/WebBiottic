name: CD Production

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # Permite ejecutar el workflow manualmente

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: production
      url: https://biottic.com.co
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
          
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
        
      - name: Build
        run: pnpm run build
        env:
          VITE_API_URL: 'https://biottic.com.co/api'
          
      - name: Install sshpass
        run: sudo apt-get install -y sshpass
          
      - name: Add Host Key to Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
          
      - name: Deploy to Production Server
        env:
          DEPLOY_HOST: ${{ secrets.SSH_HOST }}
          DEPLOY_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PASS: ${{ secrets.SSH_PASS }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: |
          # Empaquetar los archivos necesarios, incluyendo package.json y ecosystem.config.cjs
          cp package.json dist/
          cp ecosystem.config.cjs dist/
          tar -czf dist.tar.gz dist/
          
          # Copiar al servidor
          sshpass -p "$DEPLOY_PASS" scp -o StrictHostKeyChecking=no dist.tar.gz $DEPLOY_USER@$DEPLOY_HOST:/tmp/
          
          # Ejecutar comandos de despliegue en el servidor
          sshpass -p "$DEPLOY_PASS" ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_HOST << 'EOSSH'
            set -e # Exit on error
            
            # Preparar directorio
            mkdir -p /home/admin/web/biottic.com.co/public_html
            rm -rf /home/admin/web/biottic.com.co/public_html/*
            cd /home/admin/web/biottic.com.co/public_html
            
            # Extraer archivos
            tar xzf /tmp/dist.tar.gz --strip-components=1
            rm /tmp/dist.tar.gz
            
            # Ajustar permisos
            chown -R admin:admin .
            find . -type d -exec chmod 755 {} \;
            find . -type f -exec chmod 644 {} \;
            
            # Configurar servidor Node.js
            if [ -d "server" ]; then
              # Crear directorios de logs
              mkdir -p /var/log/biottic
              chown -R admin:admin /var/log/biottic
              
              # Crear archivo .env para el servidor
              echo "NODE_ENV=production" > .env
              echo "PORT=3000" >> .env
              echo "MONGODB_URI=mongodb://biottic_user:BioLabs2025@localhost:27017/biottic?authSource=biottic&directConnection=true&retryWrites=true&w=majority" >> .env
              echo "CORS_ORIGINS=https://test.biottic.com.co,https://biottic.com.co" >> .env
              echo "EMAIL_SERVICE=gmail" >> .env
              echo "EMAIL_USER=biottic.com@gmail.com" >> .env
              echo "EMAIL_PASS=${EMAIL_PASS}" >> .env
              echo "EMAIL_FROM=biottic.com@gmail.com" >> .env
              echo "EMAIL_TO=contacto@biottic.com.co" >> .env
              echo "EMAIL_SUBJECT_PREFIX=[Biottic Web]" >> .env
              
              # Iniciar el servidor con PM2
              echo "Starting server with PM2..."
              pm2 delete biottic-prod-server || true
              pm2 start ecosystem.config.cjs --name biottic-prod-server --env production
              pm2 save
            else
              echo "WARNING: Server directory not found after deployment"
              ls -la
            fi
            
            echo "Deployment to production completed successfully!"
          EOSSH
