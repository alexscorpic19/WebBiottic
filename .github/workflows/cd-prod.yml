name: CD Production

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # Permite ejecutar el workflow manualmente

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: production
      url: https://biottic.com.co
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
          
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
        
      - name: Build
        run: pnpm run build
        env:
          VITE_API_URL: 'https://biottic.com.co/api'
          
      - name: Install sshpass
        run: sudo apt-get install -y sshpass
          
      - name: Add Host Key to Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
          
      - name: Deploy to Production Server
        env:
          DEPLOY_HOST: ${{ secrets.SSH_HOST }}
          DEPLOY_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PASS: ${{ secrets.SSH_PASS }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          MONGODB_URI: ${{ secrets.MONGODB_URI_PROD }}
        run: |
          # Empaquetar los archivos necesarios
          cp package.json dist/
          cp ecosystem.production.cjs dist/ecosystem.production.cjs
          tar -czf dist.tar.gz -C dist .
          
          # Transferir archivos usando SFTP
          echo "
          cd /home/admin/web/biottic.com.co/public_html
          rm -rf *
          put dist.tar.gz
          bye
          " > sftp_commands.txt
          
          sshpass -p "$DEPLOY_PASS" sftp -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_HOST < sftp_commands.txt
          
          # Ejecutar comandos remotos
          sshpass -p "$DEPLOY_PASS" ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_HOST << 'EOSSH'
          set -e # Exit on error
          
          # Preparar directorio
          cd /home/admin/web/biottic.com.co/public_html
          
          # Extraer archivos
          tar xzf dist.tar.gz
          rm dist.tar.gz
          
          # Crear archivo .env para el servidor
          cat > server/.env << EOF
          NODE_ENV=production
          PORT=3001
          MONGODB_URI=${MONGODB_URI}
          CORS_ORIGINS=https://test.biottic.com.co,https://biottic.com.co
          EMAIL_SERVICE=gmail
          EMAIL_USER=${EMAIL_USER}
          EMAIL_PASS=${EMAIL_PASS}
          EMAIL_FROM=${EMAIL_FROM}
          EMAIL_TO=${EMAIL_TO}
          EMAIL_SUBJECT_PREFIX=[Biottic Web]
          EOF
          
          # Crear directorios de logs
          mkdir -p /var/log/biottic
          chown -R admin:admin /var/log/biottic
          
          # Verificar estructura de directorios
          echo "Verifying directory structure..."
          ls -la
          
          # Instalar dependencias del servidor
          echo "Installing server dependencies..."
          cd server
          if [ -f "package.json" ]; then
            pnpm install --production
          else
            # Fallback: instalar dependencias mínimas necesarias
            pnpm init
            pnpm add express cors mongoose dotenv nodemailer bcrypt joi
          fi
          cd ..
          
          # Iniciar el servidor con PM2
          pm2 delete biottic-prod-server || true
          pm2 start server/index.js --name biottic-prod-server --env production
          pm2 save
          
          echo "Deployment completed successfully!"
          EOSSH
