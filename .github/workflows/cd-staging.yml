name: CD Staging

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://test.biottic.com.co
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
          
      - name: Install dependencies
        run: pnpm install
        
      - name: Build and verify assets
        run: |
          pnpm run build
          
          # Verificar que el directorio dist/assets existe
          if [ ! -d "dist/assets" ]; then
            echo "Error: dist/assets directory not found"
            exit 1
          fi

          # Verificar que el directorio dist/server existe
          if [ ! -d "dist/server" ]; then
            echo "Error: dist/server directory not found"
            exit 1
          fi

          # Verificar archivo principal del servidor
          if [ ! -f "dist/server/index.js" ]; then
            echo "Error: dist/server/index.js not found"
            exit 1
          fi
        env:
          VITE_API_URL: 'https://test.biottic.com.co/api'
          
      - name: Prepare deployment files
        run: |
          # Copiar archivos de configuración
          cp package.json dist/
          cp ecosystem.config.cjs dist/
          
          # Modificar package.json para producción
          node -e "
            const pkg = require('./dist/package.json');
            const newPkg = {
              name: pkg.name,
              version: pkg.version,
              type: pkg.type,
              scripts: {
                start: 'node server/index.js',
                'test:email': 'tsx server/scripts/test-email.ts'
              },
              // Mantener todas las dependencias originales
              dependencies: pkg.dependencies,
              // Incluir tsx de devDependencies si es necesario
              devDependencies: {
                'tsx': pkg.devDependencies['tsx']
              }
            };
            require('fs').writeFileSync('./dist/package.json', JSON.stringify(newPkg, null, 2));
          "

          # Verificar estructura final
          echo "Estructura final del directorio dist:"
          ls -la dist/
          ls -la dist/server/
          
          # Empaquetar todo
          tar -czf dist.tar.gz dist/

      - name: Add host key to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
          
      - name: Deploy to Staging Server
        env:
          DEPLOY_HOST: ${{ secrets.SSH_HOST }}
          DEPLOY_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PASS: ${{ secrets.SSH_PASS }}
        run: |
          # Copiar al servidor
          sshpass -p "$DEPLOY_PASS" scp -o StrictHostKeyChecking=no dist.tar.gz $DEPLOY_USER@$DEPLOY_HOST:/tmp/

          # Ejecutar comandos de despliegue en el servidor
          sshpass -p "$DEPLOY_PASS" ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_HOST << 'EOF'
            # Detener el servidor actual
            pm2 stop biottic-server || true
            pm2 delete biottic-server || true

            # Preparar directorio
            rm -rf /home/admin/web/test.biottic.com.co/public_html/*
            cd /home/admin/web/test.biottic.com.co/public_html

            # Extraer archivos
            tar xzf /tmp/dist.tar.gz --strip-components=1
            rm /tmp/dist.tar.gz

            # Ejecutar script de configuración de directorios
            sudo bash setup-dirs.sh
            rm setup-dirs.sh

            # Instalar dependencias - asegurarse de que se instalan todas las dependencias
            cd /home/admin/web/test.biottic.com.co/public_html
            echo "Instalando dependencias..."
            pnpm install --prod
            echo "Verificando node_modules:"
            ls -la node_modules | grep -E 'cors|joi'  # Verificar que estas dependencias estén instaladas

            # Verificar estructura de archivos
            echo "Verificando estructura de archivos después de la instalación:"
            ls -la
            ls -la server/

            # Iniciar el servidor con PM2
            pm2 start ecosystem.config.cjs --env production

            # Guardar la configuración de PM2
            pm2 save --force

            # Verificar el estado del servidor
            pm2 status
            
            # Esperar un momento y verificar los logs
            sleep 5
            pm2 logs biottic-server --lines 50
          EOF

      - name: Verify Deployment
        run: |
          # Esperar a que el servidor esté listo
          sleep 10
          
          # Verificar que el servidor responde
          curl -f https://test.biottic.com.co/api/health || exit 1
