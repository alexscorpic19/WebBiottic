name: CD Staging

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://test.biottic.com.co

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build and Verify Assets
        run: |
          # Realizar el build
          pnpm run build

          # Verificar que el directorio dist/assets existe
          if [ ! -d "dist/assets" ]; then
            echo "Error: dist/assets directory not found"
            exit 1
          fi

          # Verificar que el directorio dist/server existe
          if [ ! -d "dist/server" ]; then
            echo "Error: dist/server directory not found"
            exit 1
          fi
        env:
          VITE_API_URL: 'https://test.biottic.com.co/api'

      - name: Install sshpass (Consider using SSH keys instead)
        run: sudo apt-get install -y sshpass

      - name: Add Host Key to Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to Staging Server
        env:
          DEPLOY_HOST: ${{ secrets.SSH_HOST }}
          DEPLOY_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PASS: ${{ secrets.SSH_PASS }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          MONGODB_URI: ${{ secrets.MONGODB_URI_STAGING }}
        run: |
          # Empaquetar los archivos necesarios, incluyendo package.json
          cp package.json dist/
          cp ecosystem.staging.cjs dist/
          tar -czf dist.tar.gz dist/

          # Copiar al servidor
          sshpass -p "$DEPLOY_PASS" scp -o StrictHostKeyChecking=no dist.tar.gz $DEPLOY_USER@$DEPLOY_HOST:/tmp/

          # Ejecutar comandos de despliegue en el servidor
          sshpass -p "$DEPLOY_PASS" ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_HOST << EOSSH
          set -e # Exit on error

          # Preparar directorio
          rm -rf /home/admin/web/test.biottic.com.co/public_html/*
          cd /home/admin/web/test.biottic.com.co/public_html

          # Extraer archivos
          tar xzf /tmp/dist.tar.gz --strip-components=1
          rm /tmp/dist.tar.gz

          # Verificar que los assets se copiaron correctamente
          if [ ! -d "assets" ]; then
            echo "Error: assets directory not found after deployment"
            exit 1
          fi

          # Ajustar permisos
          chown -R admin:admin .
          find . -type d -exec chmod 755 {} \;
          find . -type f -exec chmod 644 {} \;

          # Verificar los permisos de los assets
          ls -la assets/

          # Configurar servidor Node.js
          if [ -d "server" ]; then
            # Crear directorios de logs
            sudo mkdir -p /var/log/biottic
            sudo chown -R admin:admin /var/log/biottic

            # Instalar Node.js 20 si no está instalado
            NODE_INSTALLED=\$(node -v 2>/dev/null | grep -E '^v20' || echo "")
            if [ -z "\$NODE_INSTALLED" ]; then
              echo "Installing Node.js 20..."
              curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
              sudo apt-get install -y nodejs
            fi

            # Instalar pnpm si no está instalado
            if ! command -v pnpm &> /dev/null; then
              echo "Installing pnpm..."
              npm install -g pnpm
            fi

            # Instalar PM2 si no está instalado
            if ! command -v pm2 &> /dev/null; then
              echo "Installing PM2..."
              npm install -g pm2
            fi

            # Crear archivo .env para el servidor
            echo "NODE_ENV=production" > .env
            echo "PORT=3000" >> .env
            echo "MONGODB_URI=${MONGODB_URI}" >> .env
            echo "CORS_ORIGINS=https://test.biottic.com.co,https://biottic.com.co" >> .env
            echo "EMAIL_SERVICE=gmail" >> .env
            echo "EMAIL_USER=${EMAIL_USER}" >> .env
            echo "EMAIL_PASS=${EMAIL_PASS}" >> .env
            echo "EMAIL_FROM=${EMAIL_FROM}" >> .env
            echo "EMAIL_TO=${EMAIL_TO}" >> .env
            echo "EMAIL_SUBJECT_PREFIX=[Biottic Web]" >> .env

            # Instalar dependencias del servidor
            echo "Installing server dependencies..."
            cd server
            if [ -f "package.json" ]; then
              pnpm install --production
            else
              # Fallback: instalar dependencias mínimas necesarias
              pnpm init
              pnpm add express cors mongoose dotenv nodemailer bcrypt joi
            fi
            cd ..

            # Verificar server files
            echo "Verifying server files..."
            if [ ! -f "server/index.js" ]; then
              echo "Error: server/index.js not found"
              ls -la server/
              exit 1
            fi

            # Before starting the server, let's check what files are available
            echo "Checking server directory contents:"
            ls -la /home/admin/web/test.biottic.com.co/public_html/server/

            # Update the PM2 start command to use the correct path
            echo "Starting server with PM2..."
            pm2 delete biottic-server || true
            cd /home/admin/web/test.biottic.com.co/public_html
            pm2 start ecosystem.staging.cjs
            pm2 save
            pm2 startup

            # Verificar estado del servidor
            echo "Checking server health..."
            sleep 5
            curl -f http://localhost:3000/api/health || echo "Server health check failed"
          else
            echo "WARNING: Server directory not found after deployment"
            ls -la
          fi

          # Verificar la estructura final
          echo "Final directory structure:"
          find . -type d -maxdepth 2 | sort
          EOSSH
