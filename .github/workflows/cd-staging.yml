name: CD Staging

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://test.biottic.com.co
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
          
      - name: Install dependencies
        run: pnpm install
        
      - name: Build and verify assets
        run: |
          # Realizar el build
          pnpm run build
          
          # Verificar que el directorio dist/assets existe
          if [ ! -d "dist/assets" ]; then
            echo "Error: dist/assets directory not found"
            exit 1
          fi
        env:
          VITE_API_URL: 'https://test.biottic.com.co/api'
          
      - name: Add host key to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
          
      - name: Deploy to Staging Server
        env:
          DEPLOY_HOST: ${{ secrets.SSH_HOST }}
          DEPLOY_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PASS: ${{ secrets.SSH_PASS }}
        run: |
          # Copiar package.json y crear el archivo de producción
          cp package.json dist/
          # Modificar package.json para producción
          node -e "
            const pkg = require('./dist/package.json');
            const newPkg = {
              name: pkg.name,
              version: pkg.version,
              type: pkg.type,
              scripts: {
                start: pkg.scripts.start,
                'test:email': 'tsx server/scripts/test-email.ts'
              },
              dependencies: {
                'nodemailer': pkg.dependencies['nodemailer'],
                'dotenv': pkg.dependencies['dotenv'],
                'tsx': pkg.devDependencies['tsx']
              }
            };
            require('fs').writeFileSync('./dist/package.json', JSON.stringify(newPkg, null, 2));
          "

          # Empaquetar los archivos necesarios
          mkdir -p dist/server/scripts
          cp src/server/scripts/test-email.ts dist/server/scripts/
          tar -czf dist.tar.gz dist/

          # Copiar al servidor
          sshpass -p "$DEPLOY_PASS" scp -o StrictHostKeyChecking=no dist.tar.gz $DEPLOY_USER@$DEPLOY_HOST:/tmp/

          # Ejecutar comandos de despliegue en el servidor
          sshpass -p "$DEPLOY_PASS" ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_HOST << 'EOF'
            # Preparar directorio
            rm -rf /home/admin/web/test.biottic.com.co/public_html/*
            cd /home/admin/web/test.biottic.com.co/public_html

            # Extraer archivos
            tar xzf /tmp/dist.tar.gz --strip-components=1
            rm /tmp/dist.tar.gz

            # Instalar dependencias incluyendo tsx
            cd /home/admin/web/test.biottic.com.co/public_html
            pnpm install

            # Verificar que el archivo existe y tiene los permisos correctos
            chmod +x server/scripts/test-email.ts
          EOF
