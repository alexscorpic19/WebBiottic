name: CD Staging

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://test.biottic.com.co
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
          
      - name: Install dependencies
        run: pnpm install
        
      - name: Build and verify assets
        run: |
          # Realizar el build
          pnpm run build
          
          # Verificar que el directorio dist/assets existe
          if [ ! -d "dist/assets" ]; then
            echo "Error: dist/assets directory not found"
            exit 1
          fi
        env:
          VITE_API_URL: 'https://test.biottic.com.co/api'
          
      - name: Add host key to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
          
      - name: Deploy to Staging Server
        env:
          DEPLOY_HOST: ${{ secrets.SSH_HOST }}
          DEPLOY_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PASS: ${{ secrets.SSH_PASS }}
        run: |
          # Empaquetar los archivos necesarios
          tar -czf dist.tar.gz dist/

          # Copiar al servidor
          sshpass -p "$DEPLOY_PASS" scp -o StrictHostKeyChecking=no dist.tar.gz $DEPLOY_USER@$DEPLOY_HOST:/tmp/

          # Ejecutar comandos de despliegue en el servidor
          sshpass -p "$DEPLOY_PASS" ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_HOST << 'EOF'
            # Preparar directorio
            rm -rf /home/admin/web/test.biottic.com.co/public_html/*
            cd /home/admin/web/test.biottic.com.co/public_html

            # Extraer archivos
            tar xzf /tmp/dist.tar.gz --strip-components=1
            rm /tmp/dist.tar.gz

            # Instalar dependencias
            cd /home/admin/web/test.biottic.com.co/public_html
            pnpm install joi cors express mongoose nodemailer bcrypt dotenv
            
            # Verificar que los assets se copiaron correctamente
            if [ ! -d "assets" ]; then
              echo "Error: assets directory not found after deployment"
              exit 1
            fi
            
            # Ajustar permisos
            chown -R admin:admin .
            find . -type d -exec chmod 755 {} \;
            find . -type f -exec chmod 644 {} \;
            
            # Verificar los permisos de los assets
            ls -la assets/

            # Configurar servidor Node.js si es necesario
            if [ -d "server" ]; then
              # Instalar Node.js 20 si no está instalado
              if ! command -v node &> /dev/null; then
                curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
                sudo apt-get install -y nodejs
              fi

              # Instalar pnpm si no está instalado
              if ! command -v pnpm &> /dev/null; then
                npm install -g pnpm
              fi

              # Instalar PM2 si no está instalado
              if ! command -v pm2 &> /dev/null; then
                pnpm add -g pm2
              fi

              # Configurar logs
              sudo mkdir -p /var/log/biottic
              sudo chown -R $USER:$USER /var/log/biottic

              # Verificar estructura de directorios del servidor
              mkdir -p server
              
              # Copiar archivos del servidor
              if [ -d "server" ]; then
                cd server
                apps: [{
              name: 'biottic-api',
              script: './index.js',
              instances: 1,
              exec_mode: 'fork',
              watch: false,
              max_memory_restart: '1G',
              env_production: {
              NODE_ENV: 'production',
              PORT: 3000,
              MONGODB_URI: 'mongodb://localhost:27017/biottic',
              CORS_ORIGINS: 'https://test.biottic.com.co,https://biottic.com.co'
               },
               error_file: '/var/log/biottic/err.log',
              out_file: '/var/log/biottic/out.log',
              log_date_format: 'YYYY-MM-DD HH:mm:ss Z',
          merge_logs: true
          }]
          };
                EOFCONFIG

                # Crear archivo .env para el servidor
                cat > .env << 'EOFENV'
                NODE_ENV=production
                PORT=3000
                MONGODB_URI=mongodb://localhost:27017/biottic
                CORS_ORIGINS=https://test.biottic.com.co,https://biottic.com.co
                EMAIL_SERVICE=gmail
                EMAIL_USER=biottic.com@gmail.com
                EMAIL_PASS=${DEPLOY_PASS}
                EMAIL_FROM=biottic.com@gmail.com
                EMAIL_TO=contacto@biottic.com.co
                EMAIL_SUBJECT_PREFIX=[Biottic Web]
                EOFENV
                # Crear ecosystem.config.js
                cat > ecosystem.config.js << 'EOFCONFIG'
              module.exports = {
  

                # Verificar que index.js existe
                if [ ! -f "index.js" ]; then
                  echo "ERROR: index.js not found in server directory"
                  ls -la
                  exit 1
                fi

                # Instalar dependencias del servidor
                pnpm install express cors mongoose nodemailer bcrypt dotenv joi
                
                # Iniciar el servidor con PM2
                pm2 delete biottic-api || true
                pm2 start ecosystem.config.js --env production
                pm2 save

                # Esperar a que el servidor esté listo
                echo "Waiting for server to start..."
                sleep 10

                # Verificar estado del servidor
                curl -v http://localhost:3000/api/health || echo "Server health check failed"
                
                # Volver al directorio principal
                cd ..
              else
                echo "ERROR: Server directory not found after deployment"
                ls -la
                exit 1
              fi
            fi
          EOF
