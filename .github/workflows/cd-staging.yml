name: CD Staging

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://test.biottic.com.co
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
          
      - name: Install dependencies
        run: pnpm install
        
      - name: Build and verify assets
        run: |
          pnpm run build
          
          # Verificar que el directorio dist/assets existe
          if [ ! -d "dist/assets" ]; then
            echo "Error: dist/assets directory not found"
            exit 1
          fi
        env:
          VITE_API_URL: 'https://test.biottic.com.co/api'
          
      - name: Prepare deployment files
        run: |
          # Copiar archivos de configuración
          cp package.json dist/
          cp ecosystem.config.cjs dist/
          
          # Modificar package.json para producción
          node -e "
            const pkg = require('./dist/package.json');
            const newPkg = {
              name: pkg.name,
              version: pkg.version,
              type: pkg.type,
              scripts: {
                start: pkg.scripts.start,
                'test:email': 'tsx server/scripts/test-email.ts'
              },
              dependencies: {
                'nodemailer': pkg.dependencies['nodemailer'],
                'dotenv': pkg.dependencies['dotenv'],
                'tsx': pkg.devDependencies['tsx'],
                'express': pkg.dependencies['express'],
                'mongoose': pkg.dependencies['mongoose'],
                'cors': pkg.dependencies['cors']
              }
            };
            require('fs').writeFileSync('./dist/package.json', JSON.stringify(newPkg, null, 2));
          "

          # Preparar scripts y configuraciones
          mkdir -p dist/server/scripts
          cp src/server/scripts/test-email.ts dist/server/scripts/
          
          # Crear archivo de configuración de directorios
          cat > dist/setup-dirs.sh << 'EOF'
          #!/bin/bash
          # Crear directorios necesarios
          mkdir -p /var/log/biottic
          chown -R admin:admin /var/log/biottic
          chmod 755 /var/log/biottic

          # Crear directorio para archivos temporales
          mkdir -p /home/admin/web/test.biottic.com.co/tmp
          chown -R admin:admin /home/admin/web/test.biottic.com.co/tmp
          chmod 755 /home/admin/web/test.biottic.com.co/tmp
          EOF

          chmod +x dist/setup-dirs.sh
          
          # Empaquetar todo
          tar -czf dist.tar.gz dist/

      - name: Add host key to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
          
      - name: Deploy to Staging Server
        env:
          DEPLOY_HOST: ${{ secrets.SSH_HOST }}
          DEPLOY_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PASS: ${{ secrets.SSH_PASS }}
        run: |
          # Copiar al servidor
          sshpass -p "$DEPLOY_PASS" scp -o StrictHostKeyChecking=no dist.tar.gz $DEPLOY_USER@$DEPLOY_HOST:/tmp/

          # Ejecutar comandos de despliegue en el servidor
          sshpass -p "$DEPLOY_PASS" ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_HOST << 'EOF'
            # Detener el servidor actual
            pm2 stop biottic-server || true
            pm2 delete biottic-server || true

            # Preparar directorio
            rm -rf /home/admin/web/test.biottic.com.co/public_html/*
            cd /home/admin/web/test.biottic.com.co/public_html

            # Extraer archivos
            tar xzf /tmp/dist.tar.gz --strip-components=1
            rm /tmp/dist.tar.gz

            # Ejecutar script de configuración de directorios
            sudo bash setup-dirs.sh
            rm setup-dirs.sh

            # Instalar dependencias
            pnpm install

            # Iniciar el servidor con PM2
            pm2 start ecosystem.config.cjs --env production

            # Guardar la configuración de PM2
            pm2 save --force

            # Verificar el estado del servidor
            pm2 status
            
            # Verificar los logs por errores
            sleep 5
            pm2 logs biottic-server --lines 50
          EOF
