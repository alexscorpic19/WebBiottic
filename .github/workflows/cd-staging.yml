name: CD Staging

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://test.biottic.com.co

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build and Verify Assets
        run: |
          # Realizar el build
          pnpm run build

          # Verificar que el directorio dist/assets existe
          if [ ! -d "dist/assets" ]; then
            echo "Error: dist/assets directory not found"
            exit 1
          fi

          # Verificar que el directorio dist/server existe
          if [ ! -d "dist/server" ]; then
            echo "Error: dist/server directory not found"
            exit 1
          fi
        env:
          VITE_API_URL: 'https://test.biottic.com.co/api'

      - name: Install sshpass (Consider using SSH keys instead)
        run: sudo apt-get install -y sshpass

      - name: Add Host Key to Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to Staging Server
        env:
          DEPLOY_HOST: ${{ secrets.SSH_HOST }}
          DEPLOY_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PASS: ${{ secrets.SSH_PASS }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: |
          # Ensure server package.json exists
          mkdir -p dist/server
          cat > dist/server/package.json << 'EOF'
          {
            "name": "biottic-server",
            "type": "module",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "bcrypt": "^5.1.1",
              "cors": "^2.8.5",
              "dotenv": "^16.4.7",
              "express": "^4.21.2",
              "joi": "^17.13.3",
              "mongoose": "^8.12.1",
              "nodemailer": "^6.10.0"
            }
          }
          EOF

          # Package files
          tar -czf dist.tar.gz dist/

          # Deploy to server
          sshpass -p "$DEPLOY_PASS" scp -o StrictHostKeyChecking=no dist.tar.gz $DEPLOY_USER@$DEPLOY_HOST:/tmp/

          sshpass -p "$DEPLOY_PASS" ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_HOST << 'EOSSH'
          set -e

          # Stop existing PM2 processes
          pm2 stop biottic-server || true
          pm2 delete biottic-server || true

          # Clear and prepare directory
          rm -rf /home/admin/web/test.biottic.com.co/public_html/*
          cd /home/admin/web/test.biottic.com.co/public_html

          # Extract files
          tar xzf /tmp/dist.tar.gz --strip-components=1
          rm /tmp/dist.tar.gz

          # Server setup
          if [ -d "server" ]; then
            cd server
            pnpm install --production

            # Start server with PM2
            cd ..
            pm2 start ecosystem.config.cjs \
              --name biottic-server \
              --env production

            # Save and enable startup
            pm2 save --force
            pm2 startup
            
            # Health check
            sleep 5
            curl -f http://localhost:3000/api/health || {
              echo "Health check failed"
              pm2 logs biottic-server --lines 50
              exit 1
            }
          fi
          EOSSH
