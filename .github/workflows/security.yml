name: Security Scan

on:
  schedule:
    - cron: '0 0 * * 0'  # Ejecutar cada domingo
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:     # Permite ejecutar manualmente

jobs:
  security-staging:
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://test.biottic.com.co
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
          run_install: false

      - name: Install dependencies
        run: |
          pnpm --version
          pnpm install --no-frozen-lockfile
      
      # Análisis estático de seguridad (SAST)
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript, typescript
          
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        
      # Análisis de dependencias
      - name: Run Dependency Check
        run: pnpm audit
      
      # Escaneo de secretos
      - name: Check for hardcoded secrets
        uses: gitleaks/gitleaks-action@v2
        
      # Escaneo de vulnerabilidades web para staging usando Docker directamente
      - name: Run OWASP ZAP Scan for Staging
        run: |
          docker pull ghcr.io/zaproxy/zaproxy:stable
          # Create directory with proper permissions for ZAP reports
          mkdir -p zap-reports
          chmod 777 zap-reports
          docker run --rm -v ${PWD}/zap-reports:/zap/wrk/reports:rw --network=host \
            ghcr.io/zaproxy/zaproxy:stable zap-full-scan.py \
            -t https://test.biottic.com.co \
            -J reports/zap-staging-report.json \
            -w reports/zap-staging-report.md \
            -r reports/zap-staging-report.html \
            -a
          
      # Upload ZAP Scan Results
      - name: Upload ZAP Scan Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-staging-reports
          path: |
            zap-reports/*
          retention-days: 7
          
      # Create a summary of the scan results
      - name: Create Security Scan Summary
        if: always()
        run: |
          echo "## Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Staging Environment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The security scan completed with warnings. Please review the full report for details." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Common issues to fix:" >> $GITHUB_STEP_SUMMARY
          echo "- Add security headers (X-Frame-Options, X-Content-Type-Options, HSTS, CSP)" >> $GITHUB_STEP_SUMMARY
          echo "- Ensure all content is served over HTTPS" >> $GITHUB_STEP_SUMMARY
          echo "- Review CORS configurations" >> $GITHUB_STEP_SUMMARY
          echo "- Check for exposed hidden files" >> $GITHUB_STEP_SUMMARY
          
      # Escaneo de contenedores (si aplica)
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          
      # Notificación de resultados
      - name: Notify Security Results
        if: always()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_CHANNEL: security-alerts
          SLACK_COLOR: ${{ job.status }}
          SLACK_TITLE: Security Scan Results - Staging
          SLACK_MESSAGE: 'Staging security scan completed with status: ${{ job.status }}'

  security-production:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://biottic.com.co
    needs: security-staging
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
          run_install: false

      - name: Install dependencies
        run: |
          pnpm --version
          pnpm install --no-frozen-lockfile
      
      # Análisis estático de seguridad (SAST)
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript, typescript
          
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        
      # Análisis de dependencias
      - name: Run Dependency Check
        run: pnpm audit
      
      # Escaneo de secretos
      - name: Check for hardcoded secrets
        uses: gitleaks/gitleaks-action@v2
        
      # Escaneo de vulnerabilidades web para producción usando Docker directamente
      - name: Run OWASP ZAP Scan for Production
        run: |
          docker pull ghcr.io/zaproxy/zaproxy:stable
          # Create directory with proper permissions for ZAP reports
          mkdir -p zap-reports
          chmod 777 zap-reports
          docker run --rm -v ${PWD}/zap-reports:/zap/wrk/reports:rw --network=host \
            ghcr.io/zaproxy/zaproxy:stable zap-full-scan.py \
            -t https://biottic.com.co \
            -J reports/zap-production-report.json \
            -w reports/zap-production-report.md \
            -r reports/zap-production-report.html \
            -a
          
      - name: Upload ZAP Scan Results for Production
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-production-reports
          path: |
            zap-reports/*
          retention-days: 7
      
      # Notificación de resultados
      - name: Notify Security Results
        if: always()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_CHANNEL: security-alerts
          SLACK_COLOR: ${{ job.status }}
          SLACK_TITLE: Security Scan Results - Production
          SLACK_MESSAGE: 'Production security scan completed with status: ${{ job.status }}'
