name: Security Scan

on:
  schedule:
    - cron: '0 0 * * 0'  # Ejecutar cada domingo
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:     # Permite ejecutar manualmente

jobs:
  security-staging:
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://test.biottic.com.co
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
      
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      
      # Análisis estático de seguridad (SAST)
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: javascript, typescript
          
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2
        
      # Análisis de dependencias
      - name: Run Dependency Check
        run: pnpm audit
      
      # Escaneo de secretos
      - name: Check for hardcoded secrets
        uses: gitleaks/gitleaks-action@v2
        
      # Escaneo de vulnerabilidades web para staging
      - name: Run OWASP ZAP Scan for Staging
        uses: zaproxy/action-full-scan@v0.9.0
        with:
          target: https://test.biottic.com.co
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
          allow_issue_writing: false  # Disable automatic issue creation
          
      # Manually handle the report files
      - name: Rename ZAP Report Files
        if: always()
        run: |
          if [ -f "report.html" ]; then mv report.html zap-staging-report.html; fi
          if [ -f "report.md" ]; then mv report.md zap-staging-report.md; fi
          if [ -f "report.json" ]; then mv report.json zap-staging-report.json; fi
          
      # Fix the artifact upload step with a completely different name
      - name: Upload ZAP Scan Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-staging-reports
          path: |
            zap-staging-report.*
          retention-days: 7
          
      # Escaneo de contenedores (si aplica)
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          
      # Notificación de resultados
      - name: Notify Security Results
        if: always()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_CHANNEL: security-alerts
          SLACK_COLOR: ${{ job.status }}
          SLACK_TITLE: Security Scan Results - Staging
          SLACK_MESSAGE: 'Staging security scan completed with status: ${{ job.status }}'

  security-production:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://biottic.com.co
    needs: security-staging
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
      
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      
      # Análisis estático de seguridad (SAST)
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: javascript, typescript
          
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2
        
      # Análisis de dependencias
      - name: Run Dependency Check
        run: pnpm audit
      
      # Escaneo de secretos
      - name: Check for hardcoded secrets
        uses: gitleaks/gitleaks-action@v2
        
      # Escaneo de vulnerabilidades web para producción
      - name: Run OWASP ZAP Scan for Production
        uses: zaproxy/action-full-scan@v0.9.0
        with:
          target: https://biottic.com.co
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
          
      - name: Upload ZAP Scan Results for Production
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-scan-results-production
          path: |
            report_json.json
            report_md.md
            report_html.html
          retention-days: 7
      
      # Notificación de resultados
      - name: Notify Security Results
        if: always()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_CHANNEL: security-alerts
          SLACK_COLOR: ${{ job.status }}
          SLACK_TITLE: Security Scan Results - Production
          SLACK_MESSAGE: 'Production security scan completed with status: ${{ job.status }}'
